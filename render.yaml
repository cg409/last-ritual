# Render Blueprint — deploys the multiplayer server (Socket.IO).
# The server imports ../shared, so the whole repo is deployed and the server is started from /server.
services:
  - type: web
    name: last-ritual-server
    runtime: node
    plan: free
    region: singapore   # closest to India (use oregon / frankfurt / ohio / virginia for other places)
    rootDir: .
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_ORIGIN
        value: "*"   # after deploying Netlify, set to e.g. https://your-site.netlify.app
      - key: REPORT_TO_EMAIL      # where in-game reports are e-mailed (your private Gmail)
        sync: false
      - key: RESEND_API_KEY       # free key from resend.com (see DEPLOY.md)
        sync: false
